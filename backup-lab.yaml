apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backup-lab-repo
  namespace: postgres-ha
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 3Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: backup-lab-config
  namespace: postgres-ha
data:
  pgbackrest.conf: |
    [lab]
    pg1-path=/var/lib/postgresql/data/pgdata
    pg1-port=5432

    [global]
    repo1-path=/repo
    repo1-retention-full=2
    compress-type=gz
    compress-level=3
    log-level-console=info
---
apiVersion: v1
kind: Service
metadata:
  name: backup-lab
  namespace: postgres-ha
spec:
  clusterIP: None
  selector:
    app: backup-lab
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: backup-lab
  namespace: postgres-ha
spec:
  serviceName: backup-lab
  replicas: 1
  selector:
    matchLabels:
      app: backup-lab
  template:
    metadata:
      labels:
        app: backup-lab
    spec:
      initContainers:
        - name: permissions
          image: postgres:18-trixie
          command:
            - sh
            - -ec
          args:
            - |
              chown -R "$(id -u postgres):$(id -g postgres)" \
                /repo /var/lib/postgresql/data
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: repo
              mountPath: /repo
            - name: data
              mountPath: /var/lib/postgresql/data
      containers:
        - name: postgres
          image: postgres:18-trixie
          command:
            - bash
            - -ec
          args:
            - |
              apt-get update
              apt-get install -y pgbackrest
              pgbackrest version
              exec docker-entrypoint.sh postgres \
                -c archive_mode=on \
                -c 'archive_command=pgbackrest --stanza=lab archive-push %p'
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backup-lab-auth
                  key: password
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: repo
              mountPath: /repo
            - name: config
              mountPath: /etc/pgbackrest
      volumes:
        - name: repo
          persistentVolumeClaim:
            claimName: backup-lab-repo
        - name: config
          configMap:
            name: backup-lab-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 2Gi
